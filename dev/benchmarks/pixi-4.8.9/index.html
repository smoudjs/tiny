<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PixiJS Example</title>
  <script src="https://unpkg.com/pixi.js@4.8.9/dist/pixi.min.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <script>
    // Create the application
    const app = new PIXI.Application({
      antialias: true,
      // forceCanvas: true,
      width: 800,       // Canvas width
      height: 600,      // Canvas height
      backgroundColor: 0x000000 // Background color
    });
    window.app = app;

    // Add the canvas to the HTML body
    document.body.appendChild(app.view);

    // Create a graphics object (a spinning rectangle)
    const graphics = new PIXI.Graphics();
          window.graphics = graphics;

          graphics.beginFill(0xff3300, 0.5);
          graphics.lineStyle(10, 0xffd900, 0.5);

          // draw a shape
          graphics.moveTo(50, 50);
          graphics.lineTo(250, 50);
          graphics.lineTo(100, 100);
          graphics.lineTo(250, 220);
          graphics.lineTo(50, 220);
          graphics.lineTo(50, 50);
          graphics.closePath();
          graphics.endFill();

          // set a fill and line style again
          graphics.lineStyle(10, 0xff0000, 0.8);
          graphics.beginFill(0xff700b, 0.5);

          // draw a second shape
          graphics.moveTo(210, 300);
          graphics.lineTo(450, 320);
          graphics.lineTo(570, 350);
          graphics.quadraticCurveTo(600, 0, 480, 100);
          graphics.lineTo(330, 120);
          graphics.lineTo(410, 200);
          graphics.lineTo(210, 300);
          graphics.closePath();
          graphics.endFill();

          // draw a rectangle
          graphics.lineStyle(2, 0x0000ff, 0.5);
          graphics.drawRect(50, 250, 100, 100);

          // draw a circle
          graphics.lineStyle(0);
          graphics.beginFill(0xffff0b, 0.5);
          graphics.drawRect(470, 200, 300, 300);
          graphics.endFill();

          graphics.lineStyle(20, 0x33ff00, 0.5);
          graphics.moveTo(30, 30);
          graphics.lineTo(600, 300);

    app.stage.addChild(graphics); // Add rectangle to the stage

    // Animation loop
    app.ticker.add(() => {
      // rectangle.rotation += 0.01; // Rotate the rectangle
    });
  </script>
</body>

</html>
