<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Tiny 2d - basic</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0" />
    <link type="text/css" rel="stylesheet" href="main.css" />
  </head>
  <body>
    <!-- Import maps polyfill -->
    <!-- Remove this when import maps will be widely supported -->
    <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>

    <script type="importmap">
      {
        "imports": {
          "@smoud/tiny": "../src/index.js",
          "@smoud/tiny/misc": "../packages/misc/index.js"
        }
      }
    </script>

    <script type="module">
      import { App, WebGLRenderer, Scene, Text, Graphics, Easing } from '@smoud/tiny';

      class MyApp extends App {
        constructor(width, height) {
          super();

          this.width = width;
          this.height = height;

          this.renderer = new WebGLRenderer({
            width: width,
            height: height,
            resolution: 1.25,
            autoResize: true,
            antialias: true
          });
          this.renderer.setClearColor('#fbf9dd');

          this.inputView = this.renderer.domElement;
          document.body.appendChild(this.renderer.domElement);

          this.scene = new Scene();
        }

        create() {
          const debugText = (this.debugText = new Text('0:0', { fill: '#232323', fontSize: '20px' }));
          debugText.position.set(15, 10);
          this.scene.add(debugText);

          this.input.on('move', function (e) {
            debugText.setText(Math.floor(e.x) + ' : ' + Math.floor(e.y));
          }, this);

          this.graphics = new Graphics();
          this.graphics.beginFill('#0a6dc1');
          this.graphics.drawCircle(0, 0, 91);
          this.graphics.beginFill('#04589e');
          this.graphics.drawCircle(0, 0, 85);
          for (let i = 0; i < 40; i++) {
            this.graphics.beginFill('#5500c5', 0.06);
            this.graphics.drawCircle(0, 0, i * 2);
          }

          this.scene.add(this.graphics);
          this.graphics.position.set(520, 350);

          const text = new Text('Drag me!', { fill: '#ffffff' });
          text.anchor.set(0.5);

          this.tweens
            .add(text.scale)
            .to({ x: 1.1, y: 1.1 }, 500)
            .yoyo(true)
            .easing(Easing.Sinusoidal.InOut)
            .repeat(Infinity)
            .start();

          this.graphics.add(text);

          /**
           * Dragging logic
           */
          let dragging = false;
          let startOffsetX = 0;
          let startOffsetY = 0;

          this.input.on('up', function (e) {
            dragging = false;
          }, this);

          this.input.on('move', function (e) {
            if (dragging) {
              this.graphics.position.set(e.x + startOffsetX, e.y + startOffsetY);
            }
          }, this);

          this.graphics.on('down', function (e) {
            startOffsetX = this.graphics.position.x - e.x;
            startOffsetY = this.graphics.position.y - e.y;
            dragging = true;
          }, this);

          this.input.add(this.graphics);
        }

        setPixelRatio(dpr) {
          this.renderer.setPixelRatio(dpr);
        }

        render() {
          this.renderer.render(this.scene);
        }

        resize(width, height) {
          super.resize(width, height);
          this.renderer.resize(width, height);
        }

        destroy(clearCache) {
          super.destroy(clearCache);
          this.scene.destroy();
          this.renderer.destroy(true);
        }
      }

      const app = new MyApp(window.innerWidth, window.innerHeight);

      window.addEventListener('resize', function () {
        app.resize(window.innerWidth, window.innerHeight);
      });
    </script>
  </body>
</html>
