<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Tiny 2d - basic</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0" />
    <link type="text/css" rel="stylesheet" href="main.css" />
  </head>
  <body>
    <!-- Import maps polyfill -->
    <!-- Remove this when import maps will be widely supported -->
    <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>

    <script type="importmap">
      {
        "imports": {
          "@smoud/tiny": "../src/index.js",
          "@smoud/tiny/misc": "../packages/misc/index.js"
        }
      }
    </script>

    <script type="module">
      import { App, WebGLRenderer, Scene, Sprite, NearestFilter, Vec2 } from '@smoud/tiny';

      class MyApp extends App {
        constructor(width, height) {
          super({
            width: width,
            height: height,
            resolution: 1.25,
            autoResize: true,
            antialias: true,
            renderer: WebGLRenderer
          });

          this.renderer.setClearColor('#dfeff9');
          document.body.appendChild(this.renderer.domElement);

          this.scene = new Scene();

          this.dragTarget = null;
        }

        preload() {
          this.load.image('rabbitv3_ash', 'textures/bunnies/rabbitv3_ash.png');
          this.load.image('rabbitv3_batman', 'textures/bunnies/rabbitv3_batman.png');
          this.load.image('rabbitv3_bb8', 'textures/bunnies/rabbitv3_bb8.png');
          this.load.image('rabbitv3_neo', 'textures/bunnies/rabbitv3_neo.png');
          this.load.image('rabbitv3_sonic', 'textures/bunnies/rabbitv3_sonic.png');
          this.load.image('rabbitv3_spidey', 'textures/bunnies/rabbitv3_spidey.png');
        }

        createBunny(x, y) {
          const textureKeys = Object.keys(this.cache.texture);
          const randomTextureKey = textureKeys[(Math.random() * textureKeys.length) | 0];
          const randomTexture = this.cache.texture[randomTextureKey];

          randomTexture.base.minFilter = NearestFilter;
          randomTexture.base.magFilter = NearestFilter;

          const bunny = new Sprite(randomTexture);
          bunny.anchor.set(0.5);
          bunny.scale.set(3);
          bunny.position.set(x, y);

          bunny.draggingStartPosition = new Vec2(0, 0);

          bunny.on('down', (event) => {
            // Make sure the bunny is on top of the other bunnies
            this.scene.remove(bunny);
            this.scene.add(bunny);

            // Substract bunny position from event position to get the offset and store it in draggingStartPosition
            bunny.draggingStartPosition.set(bunny.position.x - event.x, bunny.position.y - event.y);
            this.dragTarget = bunny;
            this.onDragStart();
          });

          this.scene.add(bunny);
          this.input.add(bunny);
        }

        create() {
          for (let i = 0; i < 30; i++) {
            const x = Math.floor(50 + Math.random() * (this.width - 100));
            const y = Math.floor(50 + Math.random() * (this.height - 100));
            this.createBunny(x, y);
          }

          this.input.on('up', this.onDragEnd, this);
        }

        onDragEnd() {
          if (this.dragTarget) {
            this.dragTarget.opacity = 1;
            this.dragTarget = null;
            this.input.off('move', this.onDragMove, this);
          }
        }

        onDragStart() {
          if (this.dragTarget) {
            this.dragTarget.opacity = 0.5;
            this.input.on('move', this.onDragMove, this);
          }
        }

        onDragMove(event) {
          if (this.dragTarget) {
            this.dragTarget.position.set(
              event.x + this.dragTarget.draggingStartPosition.x,
              event.y + this.dragTarget.draggingStartPosition.y
            );
          }
        }
      }

      const app = new MyApp(window.innerWidth, window.innerHeight);

      window.addEventListener('resize', function () {
        app.resize(window.innerWidth, window.innerHeight);
      });
    </script>
  </body>
</html>
