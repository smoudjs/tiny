<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Tiny 2d - basic</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0" />
    <link type="text/css" rel="stylesheet" href="main.css" />
  </head>
  <body>
    <!-- Import maps polyfill -->
    <!-- Remove this when import maps will be widely supported -->
    <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>

    <script type="importmap">
      {
        "imports": {
          "@smoud/tiny": "../src/index.js",
          "@smoud/tiny/addons/": "./jsm/"
        }
      }
    </script>

    <script type="module">
      import { App, Scene, WebGLRenderer, Graphics } from '@smoud/tiny';

      class MyApp extends App {
        constructor(width, height) {
          super();

          this.width = width;
          this.height = height;

          this.renderer = new WebGLRenderer({
            width: this.width,
            height: this.height,
            resolution: 1.25,
            autoResize: true,
            antialias: true
          });

          this.renderer.setClearColor('#000000');

          document.body.appendChild(this.renderer.domElement);

          this.scene = new Scene();
        }

        create() {
          const graphics = new Graphics();

          // set a fill and line style
          graphics.beginFill(0xff3300);
          graphics.lineStyle(10, 0xffd900, 1);

          // draw a shape
          graphics.moveTo(50, 50);
          graphics.lineTo(250, 50);
          graphics.lineTo(100, 100);
          graphics.lineTo(250, 220);
          graphics.lineTo(50, 220);
          graphics.lineTo(50, 50);
          graphics.closePath();
          graphics.endFill();

          // set a fill and line style again
          graphics.lineStyle(10, 0xff0000, 0.8);
          graphics.beginFill(0xff700b, 1);

          // draw a second shape
          graphics.moveTo(210, 300);
          graphics.lineTo(450, 320);
          graphics.lineTo(570, 350);
          graphics.quadraticCurveTo(600, 0, 480, 100);
          graphics.lineTo(330, 120);
          graphics.lineTo(410, 200);
          graphics.lineTo(210, 300);
          graphics.closePath();
          graphics.endFill();

          // draw a rectangle
          graphics.lineStyle(2, 0x0000ff, 1);
          graphics.drawRect(50, 250, 100, 100);

          // draw a circle
          graphics.lineStyle(0);
          graphics.beginFill(0xffff0b, 0.5);
          graphics.drawCircle(470, 200, 100);
          graphics.endFill();

          graphics.lineStyle(20, 0x33ff00);
          graphics.moveTo(30, 30);
          graphics.lineTo(600, 300);

          this.scene.add(graphics);

          const thing = new Graphics();
          this.thing = thing;

          this.scene.add(thing);
          thing.position.x = 800 / 2;
          thing.position.y = 600 / 2;

          this.input.on('down', () => {
            graphics.lineStyle(Math.random() * 30, Math.random() * 0xffffff, 1);
            graphics.moveTo(Math.random() * 800, Math.random() * 600);
            graphics.bezierCurveTo(
              Math.random() * 800,
              Math.random() * 600,
              Math.random() * 800,
              Math.random() * 600,
              Math.random() * 800,
              Math.random() * 600
            );
          });
        }

        update(time, delta) {
          time *= 0.00625;
          const thing = this.thing;

          thing.clear();
          thing.lineStyle(10, 0xff0000, 1);
          thing.beginFill(0xffff00, 0.5);

          thing.moveTo(-120 + Math.sin(time) * 20, -100 + Math.cos(time) * 20);
          thing.lineTo(120 + Math.cos(time) * 20, -100 + Math.sin(time) * 20);
          thing.lineTo(120 + Math.sin(time) * 20, 100 + Math.cos(time) * 20);
          thing.lineTo(-120 + Math.cos(time) * 20, 100 + Math.sin(time) * 20);
          thing.lineTo(-120 + Math.sin(time) * 20, -100 + Math.cos(time) * 20);
          thing.closePath();

          thing.rotation = time * 0.1;
        }

        setPixelRatio(dpr) {
          this.renderer.setPixelRatio(dpr);
        }

        render() {
          this.renderer.render(this.scene);
        }

        resize(width, height) {
          super.resize(width, height);
          this.renderer.resize(width, height);
        }
      }

      const app = new MyApp(window.innerWidth, window.innerHeight);

      window.addEventListener('resize', function () {
        app.resize(window.innerWidth, window.innerHeight);
      });
    </script>
  </body>
</html>
