<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Tiny 2d - basic</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0" />
    <link type="text/css" rel="stylesheet" href="main.css" />
  </head>
  <body>
    <!-- Import maps polyfill -->
    <!-- Remove this when import maps will be widely supported -->
    <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>

    <script type="importmap">
      {
        "imports": {
          "@smoud/tiny": "../src/index.js",
          "@smoud/tiny/addons/": "./jsm/"
        }
      }
    </script>

    <script type="module">
      import { App, Scene, WebGLRenderer, Sprite, Text } from '@smoud/tiny';

      class MyApp extends App {
        constructor(width, height) {
          super({
            width: width,
            height: height,
            resolution: 1.25,
            autoResize: true,
            renderer: WebGLRenderer
          });

          this.renderer.setClearColor('#f4f4f4');
          document.body.appendChild(this.renderer.domElement);
          this.scene = new Scene();
        }

        preload() {
          this.load.image('coin', 'textures/basics/coin.png');
        }

        create() {
          var text = new Text('Hello Tiny!');
          text.anchor.set(0.5);
          text.position.set(320, 200);
          this.text = text;

          var sprite = new Sprite('coin');
          sprite.position.set(320, 400);

          this.scene.add(sprite);
          this.scene.add(text);
        }

        update(time, delta) {
          this.text.rotation += delta * 0.001;
        }
      }

      const app = new MyApp(window.innerWidth, window.innerHeight);

      window.addEventListener('resize', function () {
        app.resize(window.innerWidth, window.innerHeight);
      });
    </script>
  </body>
</html>
