<!DOCTYPE html>
<html lang="en">
  <head>
    <title>three.js webgl - geometry - cube</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0" />
    <link type="text/css" rel="stylesheet" href="main.css" />
  </head>
  <body>
    <div id="info">Build size: 110Kb. Resources size: 66Kb</div>

    <!-- Import maps polyfill -->
    <!-- Remove this when import maps will be widely supported -->
    <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>

    <script type="importmap">
      {
        "imports": {
          "@smoud/tiny": "../src/index.js",
          "@smoud/tiny/addons/": "./jsm/"
        }
      }
    </script>

    <script type="module">
      import {
        App,
        WebGLRenderer,
        Scene,
        OrthographicCamera,
        AmbientLight,
        DirectionalLight,
        Color,
        Mesh,
        BoxGeometry,
        MeshLambertMaterial,
        Cache
      } from '@smoud/tiny';

      class MyApp extends App {
        constructor(width, height) {
          super({
            width: width,
            height: height,
            renderer: WebGLRenderer,
            autoResize: true
          });

          document.body.appendChild(this.renderer.domElement);

          this.scene = new Scene();
          this.camera = new OrthographicCamera();
          this.camera.position.set(1, 1, 1);
          this.camera.lookAt(0, 0, 0);
        }

        preload() {
          this.load.image('texture', 'textures/crate.gif');
        }

        create() {
          this.ambientLight = new AmbientLight(Color.WHITE, 0.5);
          this.directionalLight = new DirectionalLight(Color.WHITE, 1);
          this.directionalLight.position.set(0, 1, 0);

          this.scene.add(this.ambientLight);
          this.scene.add(this.directionalLight);

          const box = new Mesh(
            new BoxGeometry(),
            new MeshLambertMaterial({
              map: 'texture'
              // color: new Color(0x34ff45)
            })
          );
          this.box = box;
          this.scene.add(box);
          this.resize(window.innerWidth, window.innerHeight);
        }

        update(time, delta) {
          delta *= 0.001;
          this.box.rotation.x += delta;
          this.box.rotation.z += delta;
        }
        
        resize(width, height) {
          super.resize(width, height);
          
          const camera = this.camera;

          const aspect = width / height;
          const distance = 1.5;

          camera.left = -distance * aspect;
          camera.right = distance * aspect;
          camera.top = distance;
          camera.bottom = -distance;

          camera.updateProjectionMatrix();
        }
      }

      const app = new MyApp(window.innerWidth, window.innerHeight);

      window.addEventListener('resize', function () {
        app.resize(window.innerWidth, window.innerHeight);
      });
    </script>
  </body>
</html>
