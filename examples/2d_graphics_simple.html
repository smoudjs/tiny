<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Tiny 2d - basic</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0" />
    <link type="text/css" rel="stylesheet" href="main.css" />
  </head>
  <body>
    <!-- Import maps polyfill -->
    <!-- Remove this when import maps will be widely supported -->
    <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>

    <script type="importmap">
      {
        "imports": {
          "@smoud/tiny": "../src/index.js",
          "@smoud/tiny/addons/": "./jsm/"
        }
      }
    </script>

    <script type="module">
      import { App, Scene, WebGLRenderer, Graphics } from '@smoud/tiny';

      // Prepare polygon for drawing star shape
      function prepareStarPolygon(x, y, points, radius, innerRadius, rotation = 0) {
        innerRadius = innerRadius || radius / 2;
        const startAngle = (-1 * Math.PI) / 2 + rotation;
        const len = points * 2;
        const delta = (Math.PI * 2) / len;
        const polygon = [];
        for (let i = 0; i < len; i++) {
          const r = i % 2 ? innerRadius : radius;
          const angle = i * delta + startAngle;
          polygon.push(x + r * Math.cos(angle), y + r * Math.sin(angle));
        }

        return polygon;
      }

      class MyApp extends App {
        constructor(width, height) {
          super();

          this.width = width;
          this.height = height;

          this.renderer = new WebGLRenderer({
            width: this.width,
            height: this.height,
            resolution: 1.25,
            autoResize: true,
            antialias: true
          });

          this.renderer.setClearColor('#000000');

          document.body.appendChild(this.renderer.domElement);

          this.scene = new Scene();
        }

        create() {
          const graphics = new Graphics();

          // Rectangle
          graphics.beginFill(0xde3249);
          graphics.drawRect(50, 50, 100, 100);
          graphics.endFill();

          // Rectangle + line style 1
          graphics.lineStyle(2, 0xfeeb77, 1);
          graphics.beginFill(0x650a5a);
          graphics.drawRect(200, 50, 100, 100);
          graphics.endFill();

          // Rectangle + line style 2
          graphics.lineStyle(10, 0xffbd01, 1);
          graphics.beginFill(0xc34288);
          graphics.drawRect(350, 50, 100, 100);
          graphics.endFill();

          // Rectangle 2
          graphics.lineStyle(2, 0xffffff, 1);
          graphics.beginFill(0xaa4f08);
          graphics.drawRect(530, 50, 140, 100);
          graphics.endFill();

          // Circle
          graphics.lineStyle(0); // draw a circle, set the lineStyle to zero so the circle doesn't have an outline
          graphics.beginFill(0xde3249, 1);
          graphics.drawCircle(100, 250, 50);
          graphics.endFill();

          // Circle + line style 1
          graphics.lineStyle(2, 0xfeeb77, 1);
          graphics.beginFill(0x650a5a, 1);
          graphics.drawCircle(250, 250, 50);
          graphics.endFill();

          // Circle + line style 2
          graphics.lineStyle(10, 0xffbd01, 1);
          graphics.beginFill(0xc34288, 1);
          graphics.drawCircle(400, 250, 50);
          graphics.endFill();

          // Ellipse + line style 2
          graphics.lineStyle(2, 0xffffff, 1);
          graphics.beginFill(0xaa4f08, 1);
          graphics.drawEllipse(600, 250, 80, 50);
          graphics.endFill();

          // draw a shape
          graphics.beginFill(0xff3300);
          graphics.lineStyle(4, 0xffd900, 1);
          graphics.moveTo(50, 350);
          graphics.lineTo(250, 350);
          graphics.lineTo(100, 400);
          graphics.lineTo(50, 350);
          graphics.closePath();
          graphics.endFill();

          // draw a rounded rectangle
          graphics.lineStyle(2, 0xff00ff, 1);
          graphics.beginFill(0x650a5a, 0.25);
          graphics.drawRoundedRect(50, 440, 100, 100, 16);
          graphics.endFill();

          // draw star
          graphics.lineStyle(2, 0xffffff);
          graphics.beginFill(0x35cc5a, 1);
          graphics.drawPolygon(prepareStarPolygon(360, 370, 5, 50));
          graphics.endFill();

          // draw star 2
          graphics.lineStyle(2, 0xffffff);
          graphics.beginFill(0xffcc5a, 1);
          graphics.drawPolygon(prepareStarPolygon(280, 510, 7, 50));
          graphics.endFill();

          // draw star 3
          graphics.lineStyle(4, 0xffffff);
          graphics.beginFill(0x55335a, 1);
          graphics.drawPolygon(prepareStarPolygon(470, 450, 4, 50));
          graphics.endFill();

          // draw polygon
          const path = [600, 370, 700, 460, 780, 420, 730, 570, 590, 520];

          graphics.lineStyle(0);
          graphics.beginFill(0x3500fa, 1);
          graphics.drawPolygon(path);
          graphics.endFill();

          this.scene.add(graphics);
        }

        render() {
          this.renderer.render(this.scene);
        }

        resize(width, height) {
          super.resize(width, height);
          this.renderer.resize(width, height);
        }
      }

      const app = new MyApp(window.innerWidth, window.innerHeight);

      window.addEventListener('resize', function () {
        app.resize(window.innerWidth, window.innerHeight);
      });
    </script>
  </body>
</html>
